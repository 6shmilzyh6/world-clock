<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="世界时钟">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2029'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23e2ecff' stroke-width='2.6'/%3E%3Cellipse cx='32' cy='32' rx='6' ry='17' fill='none' stroke='%238cb4ff' stroke-width='1.8'/%3E%3Cline x1='32' y1='32' x2='32' y2='19' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='32' y1='32' x2='43' y2='38' stroke='%234fc8ff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>世界时钟 · World Clock</title>
<style>
/* ================= 世界时钟 · 样式 ================= */
:root {
  --bg: #0f1115;
  --bg2: #161a21;
  --card: #1b2029;
  --card2: #222834;
  --line: #2b323f;
  --txt: #e8edf6;
  --txt2: #9aa6ba;
  --txt3: #6d7889;
  --accent: #4f8cff;
  --ok: #3ecf8e;
  --warn: #f5a524;
  --bad: #f0553d;
  --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.app { max-width: 560px; margin: 0 auto; padding: 8px 14px 40px; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 2px 12px;
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, var(--bg) 72%, rgba(15,17,21,0));
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: .3px; }
.logo { font-size: 18px; }
.topactions { margin-left: auto; display: flex; gap: 8px; }
.iconbtn {
  background: var(--card); border: 1px solid var(--line); color: var(--txt2);
  border-radius: 12px; padding: 7px 10px; font-size: 13px; cursor: pointer;
}
.iconbtn:active { background: var(--card2); }

/* ---------- 我的位置 ---------- */
.basecard {
  background: linear-gradient(150deg, #23304a 0%, #1b2029 62%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px 16px;
  margin-bottom: 12px;
}
.basecard-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--txt2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(62,207,142,.14); }
.spacer { flex: 1; }
.basecard-body { display: flex; align-items: flex-end; gap: 14px; margin-top: 6px; }
.bigtime {
  font-size: 46px; font-weight: 700; line-height: 1.05; letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}
.bigtime .sec { font-size: 22px; color: var(--txt2); margin-left: 3px; font-weight: 500; }
.basemeta { padding-bottom: 8px; min-width: 0; }
#baseCity { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.muted { color: var(--txt2); }
.tiny { font-size: 11.5px; }

/* ---------- 模式切换 ---------- */
.modeswitch {
  display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 3px; margin-bottom: 10px;
}
.modebtn {
  flex: 1; background: transparent; border: 0; color: var(--txt2);
  padding: 9px 0; font-size: 13.5px; border-radius: 11px; cursor: pointer; font-family: inherit;
}
.modebtn.active { background: var(--card2); color: var(--txt); font-weight: 600; box-shadow: 0 1px 0 rgba(255,255,255,.04) inset; }

/* ---------- 指定时间面板 ---------- */
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px; margin-bottom: 12px;
}
.panelrow { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
.panelrow:last-child { margin-bottom: 0; }
.chip {
  font-size: 11.5px; color: var(--accent); background: rgba(79,140,255,.12);
  border-radius: 999px; padding: 5px 11px;
}
.field {
  flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--line);
  color: var(--txt); border-radius: 10px; padding: 9px 10px; font-size: 14px;
  font-family: inherit; color-scheme: dark;
}
.linkbtn {
  background: transparent; border: 0; color: var(--accent); font-size: 12.5px;
  padding: 6px 4px; cursor: pointer; font-family: inherit; white-space: nowrap;
}
.slider { width: 100%; accent-color: var(--accent); }
.quickrow { display: flex; gap: 6px; flex-wrap: wrap; }
.quickbtn {
  background: var(--bg2); border: 1px solid var(--line); color: var(--txt2);
  border-radius: 9px; padding: 6px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.quickbtn:active { background: var(--card2); color: var(--txt); }

/* ---------- 列表 ---------- */
.listhead { display: flex; align-items: center; font-size: 12.5px; color: var(--txt2); padding: 4px 4px 8px; }
.targets { display: flex; flex-direction: column; gap: 9px; }
.tcard {
  background: var(--card); border: 1px solid var(--line); border-radius: 15px;
  padding: 11px 13px; display: flex; align-items: center; gap: 11px;
  position: relative; overflow: hidden;
}
.tcard:active { background: var(--card2); }
.tcard .flag { font-size: 21px; line-height: 1; }
.tcard .left { min-width: 0; flex: 1; }
.tcard .city { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tcard .sub { font-size: 11.5px; color: var(--txt3); margin-top: 3px; display: flex; gap: 7px; flex-wrap: wrap; }
.tcard .right { text-align: right; }
.tcard .rtime { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.tcard .rtime .sec { font-size: 13px; color: var(--txt2); }
.tcard .rdate { font-size: 11.5px; color: var(--txt2); margin-top: 2px; }
.badge {
  font-size: 10.5px; padding: 2px 6px; border-radius: 6px; font-weight: 600;
  background: rgba(79,140,255,.14); color: var(--accent);
}
.badge.warn { background: rgba(245,165,36,.14); color: var(--warn); }
.badge.bad { background: rgba(240,85,61,.14); color: var(--bad); }
.badge.dst { background: rgba(62,207,142,.14); color: var(--ok); }
.daytag { font-size: 10.5px; color: var(--txt3); }
.del {
  position: absolute; right: 0; top: 0; bottom: 0; width: 0; overflow: hidden;
  background: rgba(240,85,61,.9); color: #fff; border: 0; font-size: 12px;
  transition: width .18s ease; cursor: pointer;
}
.tcard.swiped .del { width: 62px; }
.empty {
  text-align: center; color: var(--txt3); font-size: 13px; padding: 34px 12px;
  border: 1px dashed var(--line); border-radius: 15px; line-height: 1.9;
}
.addbtn {
  width: 100%; margin-top: 11px; padding: 13px; border-radius: 14px;
  background: rgba(79,140,255,.1); border: 1px dashed rgba(79,140,255,.45);
  color: var(--accent); font-size: 14px; cursor: pointer; font-family: inherit;
}
.addbtn:active { background: rgba(79,140,255,.18); }
.foot { text-align: center; color: var(--txt3); font-size: 11px; padding: 20px 0 6px; line-height: 1.8; }

/* ---------- 弹层 ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet.hidden { display: none; }
.sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(2px); }
.sheet-body {
  position: relative; background: var(--bg2); border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--line);
  max-height: 86vh; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
  animation: up .22s ease;
}
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
.sheet-head strong { font-size: 15.5px; }
.search {
  flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--txt);
  border-radius: 11px; padding: 10px 12px; font-size: 14px; font-family: inherit;
}
.picker-hint { padding: 0 16px 6px; font-size: 11.5px; color: var(--txt3); }
.picker-list, .detail-list { overflow-y: auto; padding: 0 8px 16px; -webkit-overflow-scrolling: touch; }
.pitem {
  display: flex; align-items: center; gap: 10px; padding: 11px 10px;
  border-radius: 11px; cursor: pointer;
}
.pitem:active { background: var(--card); }
.pitem .pname { font-size: 14px; }
.pitem .psub { font-size: 11px; color: var(--txt3); margin-top: 2px; }
.pitem .pright { margin-left: auto; font-size: 12px; color: var(--txt2); font-variant-numeric: tabular-nums; }
.pitem.on { background: rgba(79,140,255,.1); }

.detail-list { padding: 4px 16px 22px; }
.detail-row {
  display: flex; padding: 10px 0; border-bottom: 1px solid var(--line);
  font-size: 13.5px; align-items: center; gap: 10px;
}
.detail-row .k { color: var(--txt2); font-size: 12.5px; min-width: 92px; }
.detail-row .v { flex: 1; text-align: right; font-variant-numeric: tabular-nums; }
.year-strip { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 14px; }
.ystrip-item {
  flex: 0 0 auto; text-align: center; padding: 9px 12px; border-radius: 11px;
  background: var(--card); border: 1px solid var(--line); font-size: 12px; min-width: 74px;
}
.ystrip-item b { display: block; font-size: 15px; margin: 4px 0 2px; }
.ystrip-item.now { border-color: var(--accent); background: rgba(79,140,255,.12); }

.set-list { padding: 4px 16px 24px; }
.setrow { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.setrow.danger { color: var(--bad); }
.setrow.about { display: block; color: var(--txt3); font-size: 11.5px; line-height: 1.9; border-bottom: 0; padding-top: 16px; }
.switchbtn {
  margin-left: auto; background: var(--card); border: 1px solid var(--line); color: var(--txt2);
  border-radius: 999px; padding: 5px 14px; font-size: 12px; cursor: pointer; font-family: inherit; min-width: 58px;
}
.switchbtn.on { background: rgba(79,140,255,.16); border-color: rgba(79,140,255,.5); color: var(--accent); }
.hidden { display: none !important; }

/* ---------- 亮色 ---------- */
body.light {
  --bg: #f3f5f9; --bg2: #ffffff; --card: #ffffff; --card2: #eef2f8;
  --line: #e0e6ef; --txt: #14181f; --txt2: #5a6675; --txt3: #8b97a8;
  --accent: #2563eb;
}
body.light .basecard { background: linear-gradient(150deg, #dbe7ff 0%, #ffffff 62%); }
body.light .bigtime { color: #0d1420; }
body.light .topbar { background: linear-gradient(180deg, var(--bg) 72%, rgba(243,245,249,0)); }
body.light .field, body.light .search { color-scheme: light; }

@media (min-width: 620px) {
  .bigtime { font-size: 56px; }
  .tcard .rtime { font-size: 23px; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">🌐</span>
      <span id="appTitle">世界时钟</span>
    </div>
    <div class="topactions">
      <button class="iconbtn" id="btnLang" title="语言 / Language">中/EN</button>
      <button class="iconbtn" id="btnSettings" title="设置">⚙️</button>
    </div>
  </header>

  <main id="main">
    <!-- 我的位置 -->
    <section class="basecard" id="baseCard">
      <div class="basecard-head">
        <span class="dot"></span>
        <span id="baseLabel">我的位置</span>
        <span class="spacer"></span>
        <button class="linkbtn" id="btnPickBase">切换</button>
      </div>
      <div class="basecard-body">
        <div class="bigtime" id="baseTime">--:--</div>
        <div class="basemeta">
          <div id="baseCity">—</div>
          <div class="muted" id="baseSub">—</div>
        </div>
      </div>
    </section>

    <!-- 模式 -->
    <div class="modeswitch" role="tablist">
      <button class="modebtn active" data-mode="now" id="modeNow">实时</button>
      <button class="modebtn" data-mode="wall" id="modeWall">指定时间</button>
    </div>

    <!-- 指定时间面板 -->
    <section class="panel hidden" id="wallPanel">
      <div class="panelrow">
        <label class="chip" id="refChip">基准：我的位置</label>
        <span class="spacer"></span>
        <button class="linkbtn" id="btnPickRef">换基准城市</button>
      </div>
      <div class="panelrow">
        <input type="date" id="inDate" class="field">
        <input type="time" id="inTime" class="field">
        <button class="linkbtn" id="btnResetNow">现在</button>
      </div>
      <div class="panelrow">
        <span class="tiny muted" id="sliderVal">—</span>
        <input type="range" id="timeSlider" min="0" max="1439" step="5" class="slider">
      </div>
      <div class="quickrow" id="quickRow"></div>
    </section>

    <!-- 目标列表 -->
    <div class="listhead">
      <span id="targetsTitle">对照城市</span>
      <span class="spacer"></span>
      <span class="tiny muted" id="targetCount"></span>
    </div>
    <section id="targetList" class="targets"></section>

    <button class="addbtn" id="btnAdd">＋ <span id="addLabel">添加城市</span></button>
    <div class="foot" id="foot"></div>
  </main>
</div>

<!-- 城市选择器 -->
<div class="sheet hidden" id="pickerSheet">
  <div class="sheet-mask" data-close="picker"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <input class="search" id="pickerSearch" placeholder="搜索城市 / 时区">
      <button class="linkbtn" data-close="picker">关闭</button>
    </div>
    <div class="picker-hint" id="pickerHint"></div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>

<!-- 城市详情 -->
<div class="sheet hidden" id="detailSheet">
  <div class="sheet-mask" data-close="detail"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <strong id="detailTitle">—</strong>
      <span class="spacer"></span>
      <button class="linkbtn" data-close="detail">关闭</button>
    </div>
    <div class="detail-list" id="detailList"></div>
  </div>
</div>

<!-- 设置 -->
<div class="sheet hidden" id="setSheet">
  <div class="sheet-mask" data-close="set"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <strong id="setTitle">设置</strong>
      <span class="spacer"></span>
      <button class="linkbtn" data-close="set">关闭</button>
    </div>
    <div class="set-list">
      <div class="setrow">
        <span id="setAuto">自动识别我的位置</span>
        <button class="linkbtn" id="btnAutoLoc">识别</button>
      </div>
      <div class="setrow">
        <span id="setFmt">24 小时制</span>
        <button class="switchbtn" id="btnFmt">24h</button>
      </div>
      <div class="setrow">
        <span id="setSec">显示秒</span>
        <button class="switchbtn" id="btnSec">关</button>
      </div>
      <div class="setrow">
        <span id="setTheme">深色主题</span>
        <button class="switchbtn" id="btnTheme">暗</button>
      </div>
      <div class="setrow">
        <span id="setAdvice">显示联系建议</span>
        <button class="switchbtn" id="btnAdvice">开</button>
      </div>
      <div class="setrow">
        <span id="setPreset">快速套用</span>
        <span class="spacer"></span>
      </div>
      <div class="quickrow" id="presetRow"></div>
      <div class="setrow danger">
        <span id="setClear">清空所有对照城市</span>
        <button class="linkbtn" id="btnClear">清空</button>
      </div>
      <div class="setrow about" id="aboutBox"></div>
    </div>
  </div>
</div>

<script>window.WC_BUILD_REGION="intl";</script>

    offsetLabelCN: offsetLabelCN,

    pickerSearch: $('pickerSearch'), pickerHint: $('pickerHint'),
    detailSheet: $('detailSheet'), detailTitle: $('detailTitle'), detailList: $('detailList'),
    setSheet: $('setSheet'), presetRow: $('presetRow'), foot: $('foot')
  };

  /* ---------------- 渲染 ---------------- */
  function baseParts() {
    var p = E.partsIn(St.baseTz, new Date());
    return p;
  }

  function wallValue() {
    var d = el.inDate.value || E.fmtDate(baseParts());
    var hm = (el.inTime.value || '09:00').split(':');
    var dp = d.split('-');
    return {
      y: parseInt(dp[0], 10), mo: parseInt(dp[1], 10), d: parseInt(dp[2], 10),
      h: parseInt(hm[0], 10) || 0, mi: parseInt(hm[1], 10) || 0
    };
  }

  function computeNow() {
    var opt = { baseTz: St.baseTz, targets: St.targets, mode: St.mode };
    if (St.mode === 'wall') {
      opt.mode = 'wall';
      opt.baseTz = St.refTz || St.baseTz;
      opt.wall = wallValue();
    }
    lastCompute = E.compute(opt);
    return lastCompute;
  }

  function swText(v) {
    if (v) return '开';
    return '关';
  }

  function applyLang() {
    document.documentElement.lang = St.lang === 'en' ? 'en' : 'zh-CN';
    document.title = t('title');
    $('appTitle').textContent = t('title');
    el.baseLabel.textContent = t('myloc');
    $('btnPickBase').textContent = t('switch');
    $('btnSettings').title = t('settings');
    $('modeNow').textContent = t('now');
    $('modeWall').textContent = t('wall');
    $('targetsTitle').textContent = t('targets');
    $('addLabel').textContent = t('add');
    $('btnPickRef').textContent = t('changeBase');
    $('btnResetNow').textContent = t('reset');
    el.pickerSearch.placeholder = t('search');
    $('setTitle').textContent = t('settings');
    $('setAuto').textContent = t('autoLoc');
    $('btnAutoLoc').textContent = t('detect');
    $('setFmt').textContent = t('fmt24');
    $('setSec').textContent = t('sec');
    $('setTheme').textContent = t('theme');
    $('setAdvice').textContent = t('advice');
    $('setPreset').textContent = t('preset');
    $('setClear').textContent = t('clear');
    $('btnClear').textContent = t('clr');
    $('aboutBox').textContent = t('about');
    $('detailClose') && ($('detailClose').textContent = t('close'));
    Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) {
      if (b.tagName === 'BUTTON' && !b.id) b.textContent = t('close');
    });
    el.foot.textContent = 'IANA tzdb · ' + E.listTimeZones().length + ' zones · v1.0';
  }

  function fmtClock(p, withSec) {
    var h = p.hour, mi = p.minute, s = p.second, suffix = '';
    if (!St.h24) {
      suffix = h < 12 ? ' AM' : ' PM';
      var h12 = h % 12; if (h12 === 0) h12 = 12;
      return pad(h12) + ':' + pad(mi) + (withSec ? ':' + pad(s) : '') + suffix;
    }
    return pad(h) + ':' + pad(mi) + (withSec ? ':' + pad(s) : '');
  }

  /* 拆成 主时间 / 秒 / 上午下午 三段，避免 12 小时制拼接错位 */
  function clockParts(p) {
    var sec = St.sec ? pad(p.second) : null;
    if (!St.h24) {
      var h = p.hour % 12; if (h === 0) h = 12;
      return { main: pad(h) + ':' + pad(p.minute), sec: sec, suffix: p.hour < 12 ? ' AM' : ' PM' };
    }
    return { main: pad(p.hour) + ':' + pad(p.minute), sec: sec, suffix: '' };
  }
  function clockHTML(p, secClass) {
    var c = clockParts(p);
    return c.main +
      (c.sec ? '<span class="' + (secClass || 'sec') + '">:' + c.sec + '</span>' : '') +
      (c.suffix ? '<span class="' + (secClass || 'sec') + '">' + c.suffix + '</span>' : '');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function cityName(tz) {
    return St.lang === 'en' ? E.cityLabelEn(tz) : E.cityLabel(tz);
  }

  function renderBase() {
    var c = computeNow();
    var b = c.base;
    var effTz = c.baseTz;                     // 实时模式=我的位置；指定时间模式=基准城市
    el.baseTime.innerHTML = clockHTML(b.parts, 'sec');
    var info = E.cityInfo(effTz);
    el.baseCity.textContent = (info.flag ? info.flag + ' ' : '') + cityName(effTz);
    var bits = [b.week, b.date, b.offsetText];
    if (b.dst) bits.push(t('dst'));
    if (St.lang === 'en') bits = [b.weekEN, b.date, b.offsetText].concat(b.dst ? [t('dst')] : []);
    el.baseSub.textContent = bits.join(' · ');
    if (effTz !== St.baseTz) el.baseLabel.textContent = t('base') + ' · ' + cityName(effTz);
    else el.baseLabel.textContent = t('myloc');
  }

  function renderTargets() {
    var c = lastCompute;
    el.count.textContent = St.targets.length ? (St.targets.length + ' / 10') : '';
    if (!St.targets.length) {
      el.list.innerHTML = '<div class="empty">' + t('empty').replace(/\n/g, '<br>') + '</div>';
      return;
    }
    var html = '';
    c.rows.forEach(function (r) {
      var info = E.cityInfo(r.tz);
      var name = cityName(r.tz);
      var badges = '';
      if (r.dayDiff !== 0) badges += '<span class="daytag">' + (r.dayDiff > 0 ? t('tomorrow') : t('yesterday')) + '</span>';
      if (r.dst) badges += '<span class="badge dst">' + t('dst') + '</span>';
      if (St.advice) {
        var cls = r.advice.key === 'ok' ? '' : (r.advice.key === 'sleep' ? 'bad' : 'warn');
        var label = r.advice.key === 'ok' ? t('okContact') : (r.advice.key === 'sleep' ? t('sleep') : t('warnContact'));
        badges += '<span class="badge ' + cls + '">' + label + '</span>';
      }
      var diffTxt = diffLabel(r.diffFromBase);
      var secHtml = '';
      html += '' +
        '<div class="tcard" data-tz="' + r.tz + '">' +
          '<div class="flag">' + (info.flag || '🌍') + '</div>' +
          '<div class="left">' +
            '<div class="city">' + esc(name) + '</div>' +
            '<div class="sub"><span>' + diffTxt + '</span>' + (badges ? ' · ' + badges : '') + '</div>' +
          '</div>' +
          '<div class="right">' +
            '<div class="rtime">' + clockHTML(r.parts, 'sec') + '</div>' +
            '<div class="rdate">' + (St.lang === 'en' ? r.dateEN + ' ' + r.weekEN : r.dateCN + ' ' + r.week) + '</div>' +
          '</div>' +
          '<button class="del" data-del="' + r.tz + '">' + (St.lang === 'en' ? 'Del' : '删除') + '</button>' +
        '</div>';
    });
    el.list.innerHTML = html;
  }

  function diffLabel(mins) {
    if (mins === 0) return t('sameAsBase');
    var a = Math.abs(mins);
    if (St.lang === 'en') {
      var s = (Math.round((a / 60) * 10) / 10).toString();
      return (mins > 0 ? '+' + s + t('hoursAhead') : '-' + s + t('hoursBehind'));
    }
    var hh2 = Math.floor(a / 60), mm2 = a % 60;
    var body = hh2 ? hh2 + ' 小时' : '';
    if (mm2) body += (body ? ' ' : '') + mm2 + ' 分钟';
    return (mins > 0 ? '比基准快 ' : '比基准慢 ') + body;
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render() {
    renderBase();
    renderTargets();
    renderWallUI();
  }

  function renderWallUI() {
    if (St.mode !== 'wall') { el.wallPanel.classList.add('hidden'); return; }
    el.wallPanel.classList.remove('hidden');
    var info = E.cityInfo(St.refTz);
    el.refChip.textContent = t('base') + '：' + (info.flag || '') + ' ' + E.cityLabel(St.refTz);
    var w = wallValue();
    var mins = w.h * 60 + w.mi;
    el.slider.value = String(mins);
    el.sliderVal.textContent = pad(w.h) + ':' + pad(w.mi) + '  (' + E.cityLabel(St.refTz) + ')';
  }

  function buildQuickRow() {
    if (el.quickRow.dataset.built) return;
    var presets = [
      { h: 9, label: '09:00' }, { h: 12, label: '12:00' }, { h: 18, label: '18:00' },
      { h: 20, label: '20:00' }, { h: 22, label: '22:00' }
    ];
    el.quickRow.innerHTML = presets.map(function (p) {
      return '<button class="quickbtn" data-h="' + p.h + '">' + p.label + '</button>';
    }).join('');
    el.quickRow.dataset.built = '1';
  }

  /* ---------------- 城市选择器 ---------------- */
  function openPicker(mode) {
    pickerMode = mode;
    el.pickerSearch.value = '';
    el.pickerHint.textContent = mode === 'base' || mode === 'ref' ? t('tipPick') : t('tipAdd');
    renderPicker('');
    el.pickerSheet.classList.remove('hidden');
    setTimeout(function () { el.pickerSearch.focus(); }, 120);
  }
  function closePicker() { el.pickerSheet.classList.add('hidden'); el.pickerSearch.blur(); }

  function renderPicker(q) {
    var list = E.searchZones(q, 60);
    var now = new Date();
    var html = list.map(function (c) {
      var off = E.offsetMinutes(c.id, now);
      var p = E.partsIn(c.id, now);
      var on = (pickerMode === 'add' && St.targets.indexOf(c.id) >= 0);
      var isBase = (c.id === St.baseTz);
      var name = St.lang === 'en'
        ? (c.id === 'UTC' ? 'UTC' : (E.cityInfo(c.id).enName || c.name))
        : (c.cn ? c.cn + ' · ' + c.name : c.name);
      var sub = c.id;
      if (St.lang === 'zh' && c.en) sub = c.en + ' · ' + c.id;
      return '<div class="pitem' + (on ? ' on' : '') + '" data-pick="' + c.id + '">' +
        '<div class="flag" style="font-size:19px">' + (c.flag || '🌍') + '</div>' +
        '<div>' +
          '<div class="pname">' + esc(name) + (isBase ? ' <span class="badge">★</span>' : '') + '</div>' +
          '<div class="psub">' + esc(sub) + '</div>' +
        '</div>' +
        '<div class="pright">' + pad(p.hour) + ':' + pad(p.minute) + '<br>' +
          '<span style="font-size:10px;color:var(--txt3)">' + E.formatOffset(off) + '</span></div>' +
      '</div>';
    }).join('');
    el.pickerList.innerHTML = html || '<div class="empty">' + t('noResult') + '</div>';
  }

  /* ---------------- 详情 ---------------- */
  function openDetail(tz) {
    detailTz = tz;
    el.detailSheet.classList.remove('hidden');
    renderDetail();
  }
  function renderDetail() {
    var tz = detailTz;
    if (!tz) return;
    var c = computeNow();
    var row = null;
    for (var i = 0; i < c.rows.length; i++) if (c.rows[i].tz === tz) row = c.rows[i];
    var now = new Date();
    if (!row) {
      var p = E.partsIn(tz, now), off = E.offsetMinutes(tz, now);
      row = {
        tz: tz, parts: p, offset: off, offsetText: E.formatOffset(off),
        dst: E.isDST(tz, now), week: E.fmtWeekCN(p), date: E.fmtDate(p)
      };
    }
    var info = E.cityInfo(tz);
    var title = cityName(tz);
    el.detailTitle.textContent = (info.flag || '🌍') + ' ' + title;

    var en = St.lang === 'en';
    var rows = [];
    rows.push([en ? 'Time now' : '当前时间', E.fmtHMS(row.parts)]);
    rows.push([en ? 'Date' : '日期', en ? (row.dateEN || row.date) + ' ' + (row.weekEN || '') : row.date + ' ' + row.week]);
    rows.push([en ? 'Time zone' : '时区', tz]);
    rows.push([en ? 'UTC offset' : 'UTC 偏移',
      en ? row.offsetText : row.offsetText + '（' + E.offsetLabelCN(row.offset) + '）']);
    rows.push([en ? 'Daylight saving' : '夏令时', row.dst ? (en ? 'Yes' : '是（DST）') : (en ? 'No' : '否')]);
    rows.push([en ? 'vs my time' : '与我的时差', diffLabel(row.offset - c.base.offset)]);

    var html = rows.map(function (r) {
      return '<div class="detail-row"><span class="k">' + r[0] + '</span><span class="v">' + esc(r[1]) + '</span></div>';
    }).join('');

    /* 逐时对照 */
    var baseHourNow = c.base.parts.hour;
    var map = [];
    for (var hh = 0; hh < 24; hh += 3) {
      var refWall = { y: c.base.parts.year, mo: c.base.parts.month, d: c.base.parts.day, h: hh, mi: 0 };
      var inst = E.wallTimeToDate(St.baseTz, refWall.y, refWall.mo, refWall.d, refWall.h, refWall.mi);
      var tp = E.partsIn(tz, inst);
      var dd = E.dayDiff(c.base.parts, tp);
      var tag = dd === 0 ? '' : (dd > 0 ? '<span class="daytag">+' + dd + '</span>' : '<span class="daytag">' + dd + '</span>');
      map.push('<div class="ystrip-item' + (Math.abs(hh - baseHourNow) < 3 ? ' now' : '') + '">' +
        pad(hh) + ':00<b>' + pad(tp.hour) + ':' + pad(tp.minute) + '</b>' + tag + '</div>');
    }
    html += '<div style="margin-top:14px;font-size:12px;color:var(--txt2)">' +
      (St.lang === 'en' ? 'My time → their time' : '我的时间 → 对方时间') + '</div>';
    html += '<div class="year-strip">' + map.join('') + '</div>';

    html += '<div class="detail-row" style="border:0;padding-top:14px">' +
      '<button class="quickbtn" data-addcur="' + tz + '" style="flex:1;padding:11px">' +
      (St.targets.indexOf(tz) >= 0 ? t('remove') : t('addTo')) + '</button></div>';

    el.detailList.innerHTML = html;
  }

  /* ---------------- 设置 ---------------- */
  function syncSettings() {
    $('btnFmt').textContent = St.h24 ? '24h' : '12h';
    $('btnFmt').classList.toggle('on', St.h24);
    $('btnSec').textContent = St.sec ? (St.lang === 'en' ? 'On' : '开') : (St.lang === 'en' ? 'Off' : '关');
    $('btnSec').classList.toggle('on', St.sec);
    $('btnAdvice').textContent = St.advice ? (St.lang === 'en' ? 'On' : '开') : (St.lang === 'en' ? 'Off' : '关');
    $('btnAdvice').classList.toggle('on', St.advice);
    $('btnTheme').textContent = St.theme === 'light' ? t('light') : t('dark');
    $('btnTheme').classList.toggle('on', St.theme !== 'light');
    document.body.classList.toggle('light', St.theme === 'light');
    if (!el.presetRow.dataset.built) {
      var ps = Object.keys(E.PRESETS).map(function (k) {
        return '<button class="quickbtn" data-preset="' + k + '">' + E.PRESETS[k].name + '</button>';
      }).join('');
      el.presetRow.innerHTML = ps;
      el.presetRow.dataset.built = '1';
    }
  }

  /* ---------------- 事件 ---------------- */
  function bind() {
    document.querySelectorAll('.modebtn').forEach(function (b) {
      b.addEventListener('click', function () {
        St.mode = b.dataset.mode; save();
        document.querySelectorAll('.modebtn').forEach(function (x) { x.classList.toggle('active', x === b); });
        if (St.mode === 'wall') {
          var now = new Date();
          var p = E.partsIn(St.refTz || St.baseTz, now);
          if (!el.inDate.value) el.inDate.value = E.fmtDate(p);
          if (!el.inTime.value) el.inTime.value = pad(p.hour) + ':' + pad(p.minute);
          buildQuickRow();
        }
        render();
      });
    });

    $('btnPickBase').addEventListener('click', function () {
      openPicker(St.mode === 'wall' ? 'ref' : 'base');
    });
    $('btnPickRef').addEventListener('click', function () { openPicker('ref'); });
    $('btnAdd').addEventListener('click', function () { openPicker('add'); });
    $('btnLang').addEventListener('click', function () {
      St.lang = St.lang === 'zh' ? 'en' : 'zh'; save();
      T = I18N[St.lang];
      applyLang(); syncSettings(); render();
    });
    $('btnSettings').addEventListener('click', function () {
      syncSettings();
      el.setSheet.classList.remove('hidden');
    });

    document.addEventListener('click', function (ev) {
      var close = ev.target.closest('[data-close]');
      if (close) {
        var which = close.dataset.close;
        if (which === 'picker') closePicker();
        if (which === 'detail') el.detailSheet.classList.add('hidden');
        if (which === 'set') el.setSheet.classList.add('hidden');
        return;
      }
      var pick = ev.target.closest('[data-pick]');
      if (pick) {
        var tz = pick.dataset.pick;
        if (pickerMode === 'base') { St.baseTz = tz; if (!St.refTz) St.refTz = tz; }
        else if (pickerMode === 'ref') { St.refTz = tz; }
        else { if (St.targets.indexOf(tz) < 0 && St.targets.length < 10) St.targets.push(tz); }
        save(); closePicker(); render();
        return;
      }
      var del = ev.target.closest('[data-del]');
      if (del) {
        var dtz = del.dataset.del;
        St.targets = St.targets.filter(function (x) { return x !== dtz; });
        save(); render(); return;
      }
      var addcur = ev.target.closest('[data-addcur]');
      if (addcur) {
        var atz = addcur.dataset.addcur;
        var idx = St.targets.indexOf(atz);
        if (idx >= 0) St.targets.splice(idx, 1);
        else if (St.targets.length < 10) St.targets.push(atz);
        save(); render(); renderDetail(); return;
      }
      var pre = ev.target.closest('[data-preset]');
      if (pre) {
        var pset = E.PRESETS[pre.dataset.preset];
        if (pset) {
          pset.tz.forEach(function (x) { if (St.targets.indexOf(x) < 0) St.targets.push(x); });
          St.targets = St.targets.slice(0, 10);
          save(); render();
        }
        return;
      }
      var hbtn = ev.target.closest('[data-h]');
      if (hbtn) {
        var h = parseInt(hbtn.dataset.h, 10);
        el.inTime.value = pad(h) + ':00';
        render(); return;
      }
      var card = ev.target.closest('.tcard');
      if (card && !ev.target.closest('.del')) {
        if (card.classList.contains('swiped')) { card.classList.remove('swiped'); return; }
        openDetail(card.dataset.tz);
      }
    });

    /* 长按显示删除 */
    var pressTimer = null;
    el.list.addEventListener('touchstart', function (ev) {
      var card = ev.target.closest('.tcard');
      if (!card) return;
      pressTimer = setTimeout(function () {
        document.querySelectorAll('.tcard.swiped').forEach(function (c) { c.classList.remove('swiped'); });
        card.classList.add('swiped');
      }, 450);
    }, { passive: true });
    ['touchend', 'touchmove', 'touchcancel'].forEach(function (e) {
      el.list.addEventListener(e, function () { clearTimeout(pressTimer); }, { passive: true });
    });

    el.pickerSearch.addEventListener('input', function () { renderPicker(this.value); });

    el.inDate.addEventListener('change', render);
    el.inTime.addEventListener('change', render);
    el.slider.addEventListener('input', function () {
      var v = parseInt(this.value, 10);
      el.inTime.value = pad(Math.floor(v / 60)) + ':' + pad(v % 60);
      render();
    });
    $('btnResetNow').addEventListener('click', function () {
      var p = E.partsIn(St.refTz || St.baseTz, new Date());
      el.inDate.value = E.fmtDate(p);
      el.inTime.value = pad(p.hour) + ':' + pad(p.minute);
      render();
    });

    $('btnAutoLoc').addEventListener('click', function () {
      St.baseTz = detectTz(); St.refTz = St.baseTz; save(); render();
    });
    $('btnFmt').addEventListener('click', function () { St.h24 = !St.h24; save(); syncSettings(); render(); });
    $('btnSec').addEventListener('click', function () { St.sec = !St.sec; save(); syncSettings(); render(); });
    $('btnAdvice').addEventListener('click', function () { St.advice = !St.advice; save(); syncSettings(); render(); });
    $('btnTheme').addEventListener('click', function () {
      St.theme = St.theme === 'light' ? 'dark' : 'light';
      save(); syncSettings(); render();
    });
    $('btnClear').addEventListener('click', function () { St.targets = []; save(); render(); });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        closePicker();
        el.detailSheet.classList.add('hidden');
        el.setSheet.classList.add('hidden');
      }
    });
  }

  /* ---------------- 启动 ---------------- */
  function tick() {
    render();
  }
  function boot() {
    applyLang();
    syncSettings();
    buildQuickRow();
    el.baseLabel.textContent = t('myloc');
    document.querySelectorAll('.modebtn').forEach(function (b) {
      b.classList.toggle('active', b.dataset.mode === St.mode);
    });
    if (St.mode === 'wall') {
      var p = E.partsIn(St.refTz || St.baseTz, new Date());
      el.inDate.value = E.fmtDate(p);
      el.inTime.value = pad(p.hour) + ':' + pad(p.minute);
    }
    bind();
    render();
    tickTimer = setInterval(tick, 1000);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { clearInterval(tickTimer); tickTimer = null; }
      else if (!tickTimer) { tickTimer = setInterval(tick, 1000); render(); }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
